name: Deploy
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install step
        run: "npm install"

      - name: Build step
        run: npx nitro build 
        env:
          NITRO_PRESET: deno_deploy

      - name: Upload to Deno Deploy
        run: |
          deno install -A -f -g jsr:@deno/deployctl
          export PATH="$HOME/.deno/bin:$PATH"

          /home/runner/.deno/bin/deployctl deploy .output/server/index.ts \
            --project=shpunter-backtesting \
            --include=./.output/public \
            --include=./.output/nitro.json
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
