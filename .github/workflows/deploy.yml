name: Deploy
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install step
        run: "npm install"

      - name: Build step
        run: npm run build
        env:
          NITRO_PRESET: deno_deploy
      - name: Verify Build Output 🔎
        run: |
          echo "Listing contents of .output directory:"
          ls -R .output/
          
          # Check for the specific file
          if [ -f .output/server/index.mjs ]; then
            echo "✅ .output/server/index.mjs was found."
          else
            echo "❌ .output/server/index.mjs was NOT found. Check your build command and NITRO_PRESET."
            exit 1 # Fail the job if the file is missing
          fi

      - name: Upload to Deno Deploy
        run: |
          deno install -A -f -g jsr:@deno/deployctl
          deployctl deploy .output/server/index.mjs
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
