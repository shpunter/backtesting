name: Deploy
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install step
        run: "npm install"

      - name: Build step
        run: npm run server:build

      - name: Upload to Deno Deploy
        run: |
          # 1. Setup
          deno install -A -f -g jsr:@deno/deployctl
          export PATH="$HOME/.deno/bin:$PATH"

          # 2. FLATTEN THE BUILD OUTPUT (The only reliable method left)
          
          # Copy server entrypoint to the root (renamed for clarity)
          cp .output/server/index.ts ./server.ts 
          
          # Copy contents of the public folder (assets, favicon, etc.) into the root
          # This ensures static assets are bundled alongside the server file.
          cp -r .output/public/* ./
          
          # 3. Deploy the single server file from the root
          deployctl deploy ./server.ts \
            --project=shpunter-backtesting \
            --token=${{ secrets.DENO_DEPLOY_TOKEN }}
          
          # 4. Cleanup (Best practice)
          rm ./server.ts
          rm -rf ./assets 
          rm -f ./favicon.ico
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}