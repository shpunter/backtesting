name: Deploy
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install step
        run: "npm install"

      - name: Build step
        run: npm run build
        env:
          NITRO_PRESET: deno_deploy

      - name: Upload to Deno Deploy
        run: |
          # 1. Install deployctl and add its binary to the shell's PATH
          deno install -A -f -g jsr:@deno/deployctl
          export PATH="$HOME/.deno/bin:$PATH"

          # 2. FLATTEN THE BUILD OUTPUT INTO THE REPOSITORY ROOT
          # This creates a simple, deployable structure at the root (./).
          
          # Copy server entrypoint to the root (renamed for a clean entrypoint)
          cp .output/server/index.ts ./server.ts 
          
          # Copy contents of the public folder (assets, favicon, etc.) into the root
          # This ensures static assets are bundled alongside the server file.
          cp -r .output/public/* ./
          
          # 3. Deploy the single server file from the root
          # This bypasses all Deno Deploy path nesting issues (like /src/.output).
          deployctl deploy ./server.ts \
            --project=shpunter-backtesting \
            --token=${{ secrets.DENO_DEPLOY_TOKEN }}
          
          # 4. Cleanup (Best practice to remove temporary files)
          rm ./server.ts
          rm -rf ./assets 
          rm -f ./favicon.ico # Use rm -f for files that might be in the root
          # You may need to add more rm commands here if other files were copied from 'public'